<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="description" content="free web tutorials">
        <meta name="author" content="thinh">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Smart Home</title>
        <link rel="stylesheet" href="stylee.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    </head>
    
    <body>
        <div class="top">
          
    <div class="title">
      <a href="index.html" class="back-button" title="Quay về danh sách phòng">
             &#8592; 
          </a>
        <h2 > 
            THỰC TẬP NHÚNG - CT4
        </h2>
        
    </div>
    <div class="Devices">
        <!-- -->
  <!-- Smart TV -->
      <div class="dev_1">
        <input type="checkbox" id="tv" class="device-toggle">
        <label for="tv" class="device-card">
          <i class="fas fa-tv fa-4x"></i>
          <p><strong>Smart TV</strong></p>
          <p>LG 50" UN81 4K</p>
          <div class="switch">
            <span class="slider round"></span>
          </div>
        </label>
      </div>

      <!-- Router -->
      <div class="dev_1">
        <input type="checkbox" id="router" class="device-toggle">
        <label for="router" class="device-card">
          <i class="fas fa-wifi fa-4x"></i>
          <p><strong>Router</strong></p>
          <p>TP-Link Archer C60 AC</p>
          <div class="switch">
            <span class="slider round"></span>
          </div>
        </label>
      </div>

      <!-- Air Conditioner -->
      <div class="dev_1">
        <input type="checkbox" id="ac" class="device-toggle">
        <label for="ac" class="device-card">
          <i class="fas fa-fan fa-4x"></i>
          <p><strong>Air Conditioner</strong></p>
          <p>Samsung AR35 A++</p>
          <div class="switch">
            <span class="slider round"></span>
          </div>
        </label>
      </div>

      <!-- Speaker -->
      <div class="dev_1">
        <input type="checkbox" id="speaker" class="device-toggle">
        <label for="speaker" class="device-card">
          <i class="fas fa-volume-up fa-4x"></i>
          <p><strong>Speaker</strong></p>
          <p>Samsung Q800T 3.1.2ch</p>
          <div class="switch">
            <span class="slider round"></span>
          </div>
        </label>
      </div>

      <!-- Spotlights -->
      <div class="dev_1">
        <input type="checkbox" id="light" class="device-toggle">
        <label for="light" class="device-card">
          <i class="fas fa-lightbulb fa-4x"></i>
          <p><strong>Spotlights</strong></p>
          <p>Phillips Hue</p>
          <div class="switch">
            <span class="slider round"></span>
          </div>
        </label>
      </div>

      <!-- Alarm -->
      <div class="dev_1">
        <input type="checkbox" id="alarm" class="device-toggle">
        <label for="alarm" class="device-card">
          <i class="fas fa-bell fa-4x"></i>
          <p><strong>Alarm</strong></p>
          <p>Frontpoint Home Alarm</p>
          <div class="switch">
            <span class="slider round"></span>
          </div>
        </label>
      </div>

   
    </div>
    
        </div>
 


    </body>


</html>
