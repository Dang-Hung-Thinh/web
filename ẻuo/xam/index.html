<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css" />
  <title>Transport Card UI</title>
</head>
<body>

<div class="container">
<div class="header">
  <div class="icon">🔔</div>
  <div class="title">🚋 Transport card</div>
  <div class="icon">...</div>
</div>
  <div class="tabs">
    <button>Payments</button>
    <button class="active">Card</button>
    <button>Tickets</button>
  </div>

  <div class="card">
    <div>Public Transport</div>
    <h3>£87.50</h3>
    <div class="logo">ⓔ</div>
  </div>

  <button class="refill-btn">Refill</button>

  <div class="history-header">
    <div>History</div>
    <button class="filter-btn">Sort by: Date</button>
  </div>

  <div class="history-item">
  <div class="icon-box">🚇</div> <!-- Icon bên trái -->
  <div class="name">
    <strong>Northolt Tube Station</strong>
    <span>13 Nov, 1:24 PM</span>
  </div>
  <div class="amount">£4.90</div>
</div>

  <div class="history-item">
    <div class="icon-box">🚘</div>
    <div class="name">
      <strong>Mini Cabs West Bridge</strong>
      <span>13 Nov, 1:40 PM</span>
    </div>
    <div class="amount">£14</div>
  </div>

  <div class="history-item">
    <div class="name">
      <strong>Conshoring Chigwell 41</strong>
      <span>12 Nov, 12:48 PM</span>
    </div>
    <div>£38.91</div>
  </div>

  <div class="footer">
    <button>🧑🏼‍💻</button>
    <button class="wallet-btn">Wallet</button>
    <button>☰</button>
  </div>
</div>

</body>
</html>
