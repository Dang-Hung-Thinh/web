<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Transport Card UI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: #f1f3f6;
      display: flex;
      justify-content: center;
      padding: 40px;
    }

    .container {
      background: #fff;
      width: 360px;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }

    .header {
      font-weight: 600;
      font-size: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .tab button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 10px;
      margin-right: 10px;
      background: #eee;
      font-weight: 600;
      cursor: pointer;
    }

    .tab .active {
      background: #ff4d4f;
      color: white;
    }

    .card-info {
      background: #cde0d4;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 15px;
    }

    .card-info h3 {
      margin-bottom: 5px;
      font-size: 14px;
      color: #444;
    }

    .card-info .balance {
      font-size: 24px;
      font-weight: 700;
      color: #222;
    }

    .refill-btn {
      width: 100%;
      padding: 12px;
      background: #ff4d4f;
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .history-title {
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 10px;
    }

    .history {
      margin-bottom: 80px;
    }

    .transaction {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .transaction .left {
      display: flex;
      flex-direction: column;
    }

    .transaction .place {
      font-weight: 600;
    }

    .transaction .time {
      font-size: 12px;
      color: gray;
    }

    .transaction .amount {
      font-weight: 600;
    }

    .bottom-nav {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      width: 360px;
      display: flex;
      justify-content: space-around;
      padding: 12px;
      border-radius: 20px;
      box-shadow: 0 5px 10px rgba(0,0,0,0.1);
    }

    .bottom-nav button {
      background: none;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }

    .bottom-nav .wallet {
      background: #ff4d4f;
      color: white;
      padding: 6px 16px;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">🚍 Transport Card</div>

    <div class="tab">
      <button>Payments</button>
      <button class="active">Card</button>
      <button>Tickets</button>
    </div>

    <div class="card-info">
      <h3>Public Transport</h3>
      <div class="balance">£87.50</div>
    </div>

    <button class="refill-btn">Refill</button>

    <div class="history-title">History</div>
    <div class="history">
      <div class="transaction">
        <div class="left">
          <div class="place">Northolt Tube Station</div>
          <div class="time">13 Nov, 1:24 PM</div>
        </div>
        <div class="amount">£4.90</div>
      </div>
      <div class="transaction">
        <div class="left">
          <div class="place">Mini Cabs West Bridge</div>
          <div class="time">13 Nov, 1:24 PM</div>
        </div>
        <div class="amount">£14</div>
      </div>
      <div class="transaction">
        <div class="left">
          <div class="place">Carsharing Chigwell 41</div>
        </div>
        <div class="amount">£38.51</div>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <button>👤</button>
    <button class="wallet">Wallet</button>
    <button>📍</button>
  </div>
</body>
</html>
