<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Transport Card UI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #e6f0ec;
      display: flex;
      justify-content: center;
      padding: 40px;
    }

    .container {
      background-color: #ffffff;
      border-radius: 25px;
      width: 340px;
      padding: 25px 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    .header {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .tabs {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .tabs button {
      flex: 1;
      padding: 10px;
      margin-right: 10px;
      border-radius: 12px;
      border: none;
      background-color: #f1f1f1;
      font-weight: bold;
      cursor: pointer;
    }

    .tabs button.active {
      background-color: #ff5252;
      color: white;
    }

    .card {
      background-color: #c2e9e1;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      color: #333;
      position: relative;
    }

    .card h3 {
      font-size: 24px;
      margin-top: 10px;
    }

    .card .logo {
      position: absolute;
      right: 20px;
      top: 20px;
      font-size: 24px;
      opacity: 0.2;
    }

    .refill-btn {
      width: 100%;
      background-color: #ff4d4d;
      color: white;
      padding: 14px;
      font-size: 16px;
      border: none;
      border-radius: 15px;
      font-weight: bold;
      margin-bottom: 25px;
      cursor: pointer;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .filter-btn {
      background-color: #d9f2e6;
      border: none;
      border-radius: 12px;
      padding: 5px 10px;
      font-size: 12px;
      color: #3c9479;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }

    .history-item .name {
      display: flex;
      flex-direction: column;
      font-size: 14px;
    }

    .history-item .icon {
      font-size: 20px;
      margin-right: 10px;
    }

    .footer {
      display: flex;
      justify-content: space-around;
      margin-top: 20px;
    }

    .footer button {
      background-color: #f1f1f1;
      border: none;
      padding: 12px;
      border-radius: 15px;
      width: 45%;
      font-weight: bold;
      cursor: pointer;
    }

    .footer .wallet-btn {
      background-color: #ff4d4d;
      color: white;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">🚋 Transport card</div>

  <div class="tabs">
    <button>Payments</button>
    <button class="active">Card</button>
    <button>Tickets</button>
  </div>

  <div class="card">
    <div>Public Transport</div>
    <h3>£87.50</h3>
    <div class="logo">ⓔ</div>
  </div>

  <button class="refill-btn">Refill</button>

  <div class="history-header">
    <div>History</div>
    <button class="filter-btn">Sort by: Date</button>
  </div>

  <div class="history-item">
    <div class="name">
      <strong>Northolt Tube Station</strong>
      <span>13 Nov, 1:24 PM</span>
    </div>
    <div>£4.90</div>
  </div>

  <div class="history-item">
    <div class="name">
      <strong>Mini Cabs West Bridge</strong>
      <span>13 Nov, 1:40 PM</span>
    </div>
    <div>£14</div>
  </div>

  <div class="history-item">
    <div class="name">
      <strong>Conshoring Chigwell 41</strong>
      <span>12 Nov, 12:48 PM</span>
    </div>
    <div>£38.91</div>
  </div>

  <div class="footer">
    <button>🧑🏼‍💻</button>
    <button class="wallet-btn">Wallet</button>
    <button>☰</button>
  </div>
</div>

</body>
</html>
