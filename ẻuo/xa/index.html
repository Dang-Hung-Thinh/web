<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transport Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <div class="header">
      <span class="bell">🔔</span>
      <h2>Transport card</h2>
      <span class="menu">⋯</span>
    </div>

    <div class="tabs">
      <button>Payments</button>
      <button class="active">Card</button>
      <button>Tickets</button>
    </div>

    <div class="card-info">
      <p class="label">Public Transport</p>
      <p class="card-number">9643 3078 3613 9741 819</p>
      <p class="balance">£87.50</p>
      <div class="card-footer">
        <span>All city zones</span>
        <span>Exp. 09/11/2021</span>
      </div>
    </div>

    <button class="refill-btn">Refill</button>

    <div class="history-section">
      <div class="history-header">
        <h3>History</h3>
        <button class="sort-btn">Sort by: Date ⌄</button>
      </div>

      <ul class="history-list">
        <li>
          <span>🚇 Northolt Tube Station</span>
          <span>£4.90</span>
        </li>
        <li>
          <span>🚕 Mini Cabs West Bridge</span>
          <span>£14</span>
        </li>
        <li>
          <span>🚗 Carsharing Chigwell 41</span>
          <span>£38.51</span>
        </li>
      </ul>
    </div>

    <div class="bottom-menu">
      <button>🏠</button>
      <button class="wallet active">Wallet</button>
      <button>📍</button>
    </div>
  </div>
</body>
</html>
