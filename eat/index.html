<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Venus Drink App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>Venus</h1>
      <input type="text" placeholder="Lemonade" />
    </header>

    <nav class="tabs">
      <button class="active">Recommend</button>
      <button>Black tea</button>
      <button>Green tea</button>
      <button>Milky</button>
    </nav>

    <section class="recommend">
      <div class="item green">
        <span class="icon">🍵</span>
        <span class="text">Green tea</span>
      </div>
      <div class="item yellow">Jasmine tea</div>
      <div class="item pink">Peach tea</div>
    </section>

    <section class="will-buy">
      <h2>Will buy</h2>
      <div class="buy-item">
        <div class="icon-box">🚘</div>
        <span class="name">Cappucci</span>
        <span class="price">24</span>
      </div>
      <div class="buy-item">
        <span class="name">Cafe Latte</span>
        <span class="price">32</span>
      </div>
      <div class="buy-item">
        <span class="name">Bruce Coffes</span>
        <span class="price">...</span>
      </div>
    </section>

    <footer>
      <button>🏠 Home</button>
      <button>🛒 Shop</button>
      <button>👤 My</button>
    </footer>
  </div>
</body>
</html>
