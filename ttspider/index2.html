<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Glitchy Self Love Animation</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    /* Gradient moving background */
    .bg-animation {
      position: absolute;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, #ff00ff, #00ffff, #ff00ff);
      background-size: 400%;
      animation: bgAnimation 10s ease infinite;
      z-index: 0;
      filter: blur(100px);
      opacity: 0.3;
    }

    @keyframes bgAnimation {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Light streaks (lines) */
    .light-line {
      position: absolute;
      width: 200%;
      height: 4px;
      background: linear-gradient(to right, transparent, rgba(255, 0, 255, 0.8), transparent);
      animation: moveLine 6s linear infinite;
      z-index: 1;
      opacity: 0.2;
    }

    .light-line:nth-child(2) {
      top: 30%;
      animation-delay: 1s;
    }

    .light-line:nth-child(3) {
      top: 60%;
      animation-delay: 2s;
    }

    @keyframes moveLine {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .text {
      font-size: 6rem;
      color: white;
      text-transform: uppercase;
      font-weight: bold;
      position: relative;
      z-index: 2;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    }

    .text::before,
    .text::after {
      content: "Self Love";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .text::before {
      color: #ff00ff;
      animation: glitch-top 1s linear infinite;
      clip-path: polygon(0 0, 100% 0, 100% 33%, 0 33%);
    }

    .text::after {
      color: #00ffff;
      animation: glitch-bottom 1.5s linear infinite;
      clip-path: polygon(0 67%, 100% 67%, 100% 100%, 0 100%);
    }

    @keyframes glitch-top {
      2%, 64% { transform: translate(2px, -2px); }
      4%, 60% { transform: translate(-2px, 2px); }
      62% { transform: translate(13px, -1px) skew(325deg); }
    }

    @keyframes glitch-bottom {
      2%, 64% { transform: translate(-2px, 0); }
      4%, 60% { transform: translate(-2px, 1px); }
      62% { transform: translate(-22px, 5px) skew(21deg); }
    }
  </style>
</head>
<body>
  <div class="bg-animation"></div>
  <div class="light-line"></div>
  <div class="light-line"></div>
  <div class="light-line"></div>
  <div class="text">Self Love</div>
</body>
</html>
