<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hex Glitch Scene with Honeycomb Effect</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      background: #000;
      overflow: hidden;
      font-family: 'Arial', sans-serif;
      position: relative;
    }

    .bg-container {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
    }

    .bg-gradient {
      position: absolute;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, #ff00ff, #00ffff, #ff6600, #ff00ff);
      background-size: 400%;
      animation: bgAnimation 15s ease infinite, glitchBg 0.5s ease infinite;
      filter: blur(100px);
      opacity: 0.4;
      will-change: transform, opacity;
    }

    @keyframes bgAnimation {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes glitchBg {
      0% { transform: translate(0, 0); opacity: 0.4; }
      50% { transform: translate(2px, -2px); opacity: 0.45; }
      100% { transform: translate(0, 0); opacity: 0.4; }
    }

    /* Neon Grid Effect */
    .neon-grid {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .grid-line {
      position: absolute;
      background: transparent;
      box-shadow: 0 0 10px rgba(255, 0, 255, 0.8), 0 0 20px rgba(255, 165, 0, 0.6);
      animation: glitchGrid 0.5s ease infinite;
      will-change: transform, opacity;
    }

    .grid-line.horizontal {
      width: 100%;
      height: 2px;
      background: linear-gradient(to right, transparent, rgba(255, 0, 255, 0.8), transparent);
    }

    .grid-line.vertical {
      width: 2px;
      height: 100%;
      background: linear-gradient(to bottom, transparent, rgba(255, 165, 0, 0.8), transparent);
    }

    .grid-line.diagonal-left {
      width: 150%;
      height: 2px;
      background: linear-gradient(to right, transparent, rgba(0, 255, 255, 0.8), transparent);
      transform: rotate(45deg);
      transform-origin: 0 0;
    }

    .grid-line.diagonal-right {
      width: 150%;
      height: 2px;
      background: linear-gradient(to right, transparent, rgba(255, 165, 0, 0.8), transparent);
      transform: rotate(-45deg);
      transform-origin: 0 0;
    }

    @keyframes glitchGrid {
      0% { transform: translate(0, 0); opacity: 0.8; }
      50% { transform: translate(2px, -2px); opacity: 0.7; }
      100% { transform: translate(0, 0); opacity: 0.8; }
    }

    .hex-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
    }

    .hex-frame {
      position: absolute;
      width: 80vmin;
      height: 80vmin;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
      background: rgba(255, 140, 0, 0.1);
      border: 2px solid rgba(255, 165, 0, 0.8);
      box-shadow: 0 0 20px rgba(255, 140, 0, 0.6), inset 0 0 10px rgba(255, 0, 255, 0.4);
      animation: hexPulse 6s ease-in-out infinite, glitchHex 0.4s ease infinite;
      will-change: transform, opacity;
    }

    .hex-frame:nth-child(1) { width: 30vmin; height: 30vmin; animation-delay: 0s; }
    .hex-frame:nth-child(2) { width: 40vmin; height: 40vmin; animation-delay: 0.5s; }
    .hex-frame:nth-child(3) { width: 50vmin; height: 50vmin; animation-delay: 1s; }
    .hex-frame:nth-child(4) { width: 60vmin; height: 60vmin; animation-delay: 1.5s; }
    .hex-frame:nth-child(5) { width: 70vmin; height: 70vmin; animation-delay: 2s; }
    .hex-frame:nth-child(6) { width: 80vmin; height: 80vmin; animation-delay: 2.5s; }

    @keyframes hexScale {
      0%, 100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }
      50% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }

    @keyframes hexPulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.85; }
      50% { transform: translate(-50%, -50%) scale(1.05); opacity: 1; }
    }

    @keyframes glitchHex {
      0% { transform: translate(-50%, -50%) translate(0, 0); opacity: 1; }
      50% { transform: translate(-50%, -50%) translate(4px, -4px); opacity: 0.9; }
      100% { transform: translate(-50%, -50%) translate(0, 0); opacity: 1; }
    }

    .orbit-item {
      position: absolute;
      width: 8px;
      height: 8px;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      animation: orbit 5s linear infinite, glitchItem 0.4s ease infinite;
      will-change: transform;
    }

    .orbit-item.square { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); }
    .orbit-item.triangle { clip-path: polygon(50% 0%, 100% 100%, 0% 100%); }

    @keyframes orbit {
      0% { transform: rotate(0deg) translateX(15vmin) rotate(0deg); }
      100% { transform: rotate(360deg) translateX(15vmin) rotate(360deg); }
    }

    @keyframes glitchItem {
      0% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.1) translate(2px, -2px); opacity: 0.7; }
      100% { transform: scale(1); opacity: 0.8; }
    }

    .particles {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .particle {
      position: absolute;
      width: 6px;
      height: 6px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      animation: particleMove 10s linear infinite, glitchParticle 0.4s ease infinite;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      will-change: transform, opacity;
    }

    .particle:nth-child(2) { top: 20%; left: 10%; animation-delay: -2s; }
    .particle:nth-child(3) { top: 50%; left: 80%; animation-delay: -4s; }
    .particle:nth-child(4) { top: 70%; left: 30%; animation-delay: -6s; }
    .particle:nth-child(5) { top: 10%; left: 60%; animation-delay: -8s; }

    @keyframes particleMove {
      0% { transform: translate(0, 0); opacity: 1; }
      100% { transform: translate(100vw, 100vh); opacity: 0; }
    }

    @keyframes glitchParticle {
      0% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.1) translate(2px, -2px); opacity: 0.8; }
      100% { transform: scale(1); opacity: 0.9; }
    }

    .light-line {
      position: absolute;
      width: 200%;
      height: 2px;
      background: linear-gradient(to right, transparent, rgba(255, 0, 255, 0.8), transparent);
      animation: moveLine 4s linear infinite, glitchLine 0.5s ease infinite;
      z-index: 1;
      opacity: 0.3;
      will-change: transform, opacity;
    }

    .light-line:nth-child(2) { top: 30%; animation-delay: 1s; }
    .light-line:nth-child(3) { top: 60%; animation-delay: 2s; }

    @keyframes moveLine {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    @keyframes glitchLine {
      0% { transform: translateX(-100%) translate(0, 0); opacity: 0.3; }
      50% { transform: translateX(-100%) translate(0, 2px); opacity: 0.35; }
      100% { transform: translateX(-100%) translate(0, 0); opacity: 0.3; }
    }

    .text-container {
      position: absolute;
      top: 5%;
      width: 100%;
      text-align: center;
      z-index: 4;
    }

    .text {
      font-size: 3vw;
      color: #fff;
      font-weight: bold;
      text-shadow: 0 0 10px #ff00ff, 0 0 20px #00ffff;
      animation: textFlicker 0.4s ease infinite;
      position: relative;
      will-change: transform, opacity;
    }

    .text::before,
    .text::after {
      content: "Self Love";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      text-align: center;
    }

    .text::before {
      color: #ff00ff;
      animation: glitchText 0.5s ease infinite;
      clip-path: polygon(0 0, 100% 0, 100% 33%, 0 33%);
    }

    .text::after {
      color: #00ffff;
      animation: glitchTextReverse 0.5s ease infinite;
      clip-path: polygon(0 67%, 100% 67%, 100% 100%, 0 100%);
    }

    @keyframes textFlicker {
      0% { opacity: 1; transform: translate(0, 0); }
      50% { opacity: 0.9; transform: translate(2px, -2px); }
      100% { opacity: 1; transform: translate(0, 0); }
    }

    @keyframes glitchText {
      0% { transform: translate(0, 0); opacity: 1; }
      50% { transform: translate(4px, -4px); opacity: 0.9; }
      100% { transform: translate(0, 0); opacity: 1; }
    }

    @keyframes glitchTextReverse {
      0% { transform: translate(0, 0); opacity: 1; }
      50% { transform: translate(-4px, 4px); opacity: 0.9; }
      100% { transform: translate(0, 0); opacity: 1; }
    }

    .character-img {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 88%;
      transform: translate(-50%, -50%);
      border-radius: 20px;
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
      z-index: 3;
      animation: glitchImg 0.4s ease infinite;
    }

    @keyframes glitchImg {
      0% { transform: translate(-50%, -50%) translate(0, 0); opacity: 1; }
      50% { transform: translate(-50%, -50%) translate(4px, -4px); opacity: 0.9; }
      100% { transform: translate(-50%, -50%) translate(0, 0); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="bg-container">
    <div class="bg-gradient"></div>
  </div>

  <!-- Neon Grid -->
  <div class="neon-grid" id="neonGrid"></div>

  <div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>

  <div class="light-line"></div>
  <div class="light-line"></div>
  <div class="light-line"></div>

  <div class="hex-container">
    <div class="hex-frame"></div>
    <div class="hex-frame"></div>
    <div class="hex-frame"></div>
    <div class="hex-frame"></div>
    <div class="hex-frame"></div>
    <div class="hex-frame"></div>
  </div>

  <img src="https://example.com/character-image.png" alt="Character" class="character-img" />

  <div class="text-container">
    <div class="text">Self Love</div>
  </div>

<script>
  // Tạo các món đồ quay quanh mỗi ô mật ong
  const hexFrames = document.querySelectorAll('.hex-frame');
  const shapes = ['circle', 'square', 'triangle'];

  hexFrames.forEach((frame, index) => {
    const numItems = 4 + Math.floor(Math.random() * 4);
    for (let i = 0; i < numItems; i++) {
      const item = document.createElement('div');
      item.classList.add('orbit-item');

      const shape = shapes[Math.floor(Math.random() * shapes.length)];
      if (shape !== 'circle') item.classList.add(shape);

      const angle = Math.random() * 360;
      const orbitDuration = 4 + Math.random() * 2;
      item.style.animation = `orbit ${orbitDuration}s linear infinite, glitchItem 0.4s ease infinite`;
      item.style.transform = `rotate(${angle}deg) translateX(${10 + index * 5}vmin) rotate(-${angle}deg)`;

      frame.appendChild(item);
    }
  });

  // Tạo mạng nhện và tia điện
  const electricWeb = document.getElementById('electricWeb');
  const webCount = 20; // Số lượng sợi mạng nhện

  for (let i = 0; i < webCount; i++) {
    // Sợi mạng nhện
    const strand = document.createElement('div');
    strand.classList.add('web-strand');
    const angle = (i / webCount) * 360;
    strand.style.transform = `rotate(${angle}deg)`;
    strand.style.left = '50%';
    strand.style.top = '0';
    electricWeb.appendChild(strand);
  }

  // Tạo các tia điện ngẫu nhiên
  const sparkCount = 10;
  for (let i = 0; i < sparkCount; i++) {
    const spark = document.createElement('div');
    spark.classList.add('electric-spark');
    spark.style.top = `${Math.random() * 100}%`;
    spark.style.left = `${Math.random() * 100}%`;
    spark.style.animationDuration = `${1.5 + Math.random() * 2}s`;
    electricWeb.appendChild(spark);
  }
</script>
</body>
</html>
