<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="free web tutorials">
  <meta name="author" content="thinh">
  <meta name="viewport" content="width=device-width, initial-scale=0.75">
  <title>Shopping Cart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="top-bar">
        <p class="menu">...</p>
      </div>
      <h1>
        <strong>Shopping cart</strong>
    </h1>
      A total of 3 Pieces
    </div>

    <div class="product">
      <div class="icon">
        <h1>🍵</h1>
      </div>
      <div class="info">
        <h3>Green tea</h3>
        <p>Signature product</p>
         <strong>36</strong>
      </div>
      <div class="price">
        <div class="couter">+</div>
        <div class="quantity">1</div>
        <div class="couter">-</div>
      </div>
    </div>

    <div class="product">
      <h1>🥤</h1>
      <div class="info">
        <h3>Rose tea</h3>
        <p>Signature product</p>
        <strong>24</strong>
      </div>
      <div class="price">
        <div class="couter">+</div>
        <div class="quantity">2</div>
        <div class="couter">-</div>
      </div>
    </div>

    <div class="product">
      <h1>☕</h1>
      <div class="info">
        <h3>Jasmine tea</h3>
        <p>Signature product</p>
        <strong>26</strong>
      </div>
      <div class="price">
        <div class="couter">+</div>
        <div class="quantity">1</div>
        <div class="couter">-</div>
      </div>
    </div>
        <br>
        <br>

    <div class="footer">
      <div class="total">Total: 110</div>
      <button>Next</button>
    </div>

    <div class="bottom-nav">
      <span>🏡 Home</span>
      <div class="nav-button active">
        <span class="icon">🛍️</span>
          <span class="label">shop</span>
         </div>
      <span>💡 My</span>
    </div>
  </div>
</body>
</html>
