<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Home Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #0f1c2e;
      color: white;
    }

    .container {
      max-width: 360px;
      margin: auto;
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
    }

    .menu {
      font-size: 24px;
      color: #fff;
      cursor: pointer;
    }

    .greeting {
      margin-top: 10px;
    }

    .greeting h2 {
      margin: 5px 0;
      font-size: 20px;
    }

    .greeting p {
      color: #aaa;
      font-size: 14px;
    }

    .room-selector {
      display: flex;
      justify-content: space-between;
      margin: 20px 0;
    }

    .room-btn {
      background-color: #1b2a40;
      padding: 10px;
      border-radius: 10px;
      flex: 1;
      margin: 0 4px;
      text-align: center;
      font-size: 12px;
      color: #ccc;
    }

    .room-btn.active {
      background-color: #ff7a00;
      color: #fff;
    }

    .rooms {
      display: flex;
      overflow-x: auto;
      gap: 10px;
      padding-bottom: 10px;
    }

    .room-card {
      background-color: #1b2a40;
      border-radius: 12px;
      overflow: hidden;
      min-width: 140px;
      flex-shrink: 0;
    }

    .room-card img {
      width: 100%;
      height: 100px;
      object-fit: cover;
    }

    .room-card p {
      margin: 0;
      padding: 10px;
      font-size: 14px;
      text-align: center;
    }

    .section-title {
      margin-top: 20px;
      margin-bottom: 10px;
      font-size: 16px;
      color: #eee;
    }

    .devices {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .device {
      background-color: #1b2a40;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }

    .device .status {
      width: 10px;
      height: 10px;
      background-color: #1f1f1f;
      border-radius: 50%;
    }

    .device.on .status {
      background-color: #00e676;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="https://i.pravatar.cc/40?img=1" alt="User">
      <div class="menu">☰</div>
    </div>

    <div class="greeting">
      <h2>Hello, Jennie</h2>
      <p>Good to see you again!</p>
    </div>

    <div class="room-selector">
      <div class="room-btn">🛋</div>
      <div class="room-btn">🛒</div>
      <div class="room-btn active">🛏</div>
      <div class="room-btn">🛁</div>
    </div>

    <div class="rooms">
      <div class="room-card">
        <img src="https://images.unsplash.com/photo-1586023492125-27b2c045efd7?auto=format&fit=crop&w=300&q=80" alt="Living Room">
        <p>Living Room</p>
      </div>
      <div class="room-card">
        <img src="https://images.unsplash.com/photo-1600585153435-1c7c3c9c93c6?auto=format&fit=crop&w=300&q=80" alt="Guest Room">
        <p>Guest Room</p>
      </div>
    </div>

    <div class="section-title">Devices</div>
    <div class="devices">
      <div class="device on">
        <span>💡 Light</span>
        <div class="status"></div>
      </div>
      <div class="device on">
        <span>🌬 Fan</span>
        <div class="status"></div>
      </div>
      <div class="device on">
        <span>🎵 Music</span>
        <div class="status"></div>
      </div>
      <div class="device">
        <span>📶 Router</span>
        <div class="status"></div>
      </div>
    </div>
  </div>
</body>
</html>
