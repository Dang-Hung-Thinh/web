<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shopping Cart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="top-bar">
        <p class="menu">...</p>
      </div>
      <p>Shopping cart</p>
      <span class="sub">A total of 3 Pieces</span>
    </div>

    <div class="product">
      <p>🍵</p>
      <div class="info">
        <h3>Green tea</h3>
        <p>Signature product</p>
         <p>36</p>
      </div>
      <div class="price">
        <div class="quantity">1</div>
      </div>
    </div>

    <div class="product">
      <p>🍵</p>
      <div class="info">
        <h3>Rose tea</h3>
        <p>Signature product</p>
        <p>24</p>
      </div>
      <div class="price">
        <div class="quantity">2</div>
      </div>
    </div>

    <div class="product">
      <p>🍵</p>
      <div class="info">
        <h3>Jasmine tea</h3>
        <p>Signature product</p>
      </div>
      <div class="price">
        <span>25</span>
        <div class="quantity">1</div>
      </div>
    </div>
        <br>
        <br>
        <br>

    <div class="footer">
      <div class="total">Total: 110</div>
      <button>Next</button>
    </div>

    <div class="bottom-nav">
      <span>🏠 Home</span>
      <span class="active">🛒 Shop</span>
      <span>👤 My</span>
    </div>
  </div>
</body>
</html>
