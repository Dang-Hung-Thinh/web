<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="description" content="free web tutorials">
        <meta name="author" content="thinh">
        <meta name="view" content="width=device-width", initial-scale="1.0">
        <link rel="stylesheet" href="stylee.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    </head>
    
    <body>
        <div class="top">
    <div class="title">
        <h2 > 
            
            <br>
            THỰC TẬP NHÚNG - CT4
        </h2>
        
    </div>
    <div class="Devices">
        <!-- -->
  <!-- Smart TV -->
      <div class="dev_1_big">
        <input type="checkbox" id="tv" class="device-toggle">
        <label for="tv" class="device-card">
          <i class="fas fa-tv fa-4x"></i>
          <p><strong>Smart TV</strong></p>
          <p>LG 50" UN81 4K</p>
          <div class="switch">
            <span class="slider round"></span>
          </div>
        </label>
      </div>

      <!-- Router -->
      <div class="dev_1">
        <input type="checkbox" id="router" class="device-toggle">
        <label for="router" class="device-card">
          <i class="fas fa-wifi fa-4x"></i>
          <p><strong>Router</strong></p>
          <p>TP-Link Archer C60 AC</p>
          <div class="switch">
            <span class="slider round"></span>
          </div>
        </label>
      </div>

      <!-- Air Conditioner -->
      <div class="dev_1">
        <input type="checkbox" id="ac" class="device-toggle">
        <label for="ac" class="device-card">
          <i class="fas fa-fan fa-4x"></i>
          <p><strong>Air Conditioner</strong></p>
          <p>Samsung AR35 A++</p>
          <div class="switch">
            <span class="slider round"></span>
          </div>
        </label>
      </div>

      

   
    </div>
    
        </div>
    </body>
    
</html>
