<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Devices</title>
    <link rel="stylesheet" href="stylee.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
    <div class="Devices">
        <div class="dev_1">
            <i class="fas fa-tv fa-2x"></i>
            <p><strong>Smart TV</strong></p>
            <p>LG 50" UN81 4K</p>
            <label class="switch">
                <input type="checkbox" checked>
                <span class="slider round"></span>
            </label>
        </div>
        <div class="dev_1">
            <i class="fas fa-wifi fa-2x"></i>
            <p><strong>Router</strong></p>
            <p>TP-Link Archer C60 AC</p>
            <label class="switch">
                <input type="checkbox" checked>
                <span class="slider round"></span>
            </label>
        </div>
        <div class="dev_1">
            <i class="fas fa-snowflake fa-2x"></i>
            <p><strong>Air Conditioner</strong></p>
            <p>Samsung AR35 A++</p>
            <label class="switch">
                <input type="checkbox" checked>
                <span class="slider round"></span>
            </label>
        </div>
        <div class="dev_1">
            <i class="fas fa-volume-up fa-2x"></i>
            <p><strong>Speaker</strong></p>
            <p>Samsung Q800T 3.1.2ch</p>
            <label class="switch">
                <input type="checkbox">
                <span class="slider round"></span>
            </label>
        </div>
        <div class="dev_1">
            <i class="fas fa-lightbulb fa-2x"></i>
            <p><strong>Spotlights</strong></p>
            <p>Phillips Hue</p>
            <label class="switch">
                <input type="checkbox">
                <span class="slider round"></span>
            </label>
        </div>
        <div class="dev_1">
            <i class="fas fa-bell fa-2x"></i>
            <p><strong>Alarm</strong></p>
            <p>Frontpoint Home Alarm</p>
            <label class="switch">
                <input type="checkbox">
                <span class="slider round"></span>
            </label>
        </div>
    </div>
</body>
</html>
