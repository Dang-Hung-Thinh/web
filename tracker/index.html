<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Transport Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">

    <!-- Header -->
    <div class="header">
      <div class="icon">🔔</div>
      <div class="avatar">
        <img src="download.png" alt="User" />
        <p>TOM</p>
      </div>
      <div class="icon">⋯</div>
    </div>

    <!-- Stats Box -->
    <div class="stats-box">
      <div class="stat"><strong>8</strong><span>Rides</span></div>
      <div class="stat"><strong>14$</strong><span>Spent</span></div>
      <div class="stat"><strong>1</strong><span>Tickets</span></div>

      <div class="tabs">
        <button class="active">Day</button>
        <button>Week</button>
        <button>Month</button>
      </div>
    </div>

    <!-- Saved Routes -->
    <div class="section-title">Saved routes</div>
    <div class="routes">
      <div class="route-icon">🚕<span>Taxi</span></div>
      <div class="route-icon active">🚎<span>Trolley</span></div>
      <div class="route-icon">🚋<span>Tram</span></div>
      <div class="route-icon">🚗<span>Car</span></div>
      <div class="route-icon">🚇<span>Subway</span></div>
    </div>

    <!-- Route Card -->
    <div class="route-card">
      <div class="map">🗺️</div>
      <div class="info">
        <p><strong>Going to Paul by bike</strong></p>
        <p>📍 Winchester Rd. 29<br/>📍 Athlone St. 37</p>
        <div class="time">
          🚲 26 min • 3.5 km
        </div>
      </div>
    </div>

    <!-- Personal Propositions -->
    <div class="section-title">Personal propositions</div>
   <div class="bottom-bar">
  <div class="nav-button active">
    <span class="icon">🥰</span>
    <span class="label">Profile</span>
  </div>
  <div class="nav-button">
    <span class="icon">📄</span>
  </div>
  <div class="nav-button">
    <span class="icon">🗺️</span>
  </div>
</div>


  </div>
</body>
</html>
